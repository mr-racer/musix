# v2 prod edge: behind the VPS nginx and the reverse SSH tunnel, so every request arrives
# from loopback; the real client address comes from the VPS's X-Forwarded-For (the auth
# rate limit would otherwise throttle all users as one).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_tokens off;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;

    # the 1.0.0 app still calls /api/v1: tell it to update, with the link (spec §3)
    location /api/v1/ {
        default_type application/json;
        add_header Upgrade "MusiX/2" always;
        return 426 '{"type":"about:blank","title":"Upgrade Required","status":426,"detail":"MusiX обновился — установи новое приложение","download":"/download/musix.apk"}';
    }
    location /api/v2/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
    }
    location /api/v2/uploads {
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_pass http://api;
    }
    location /api/v2/ {
        proxy_pass http://api;
    }
    location = /metrics { return 404; }
    location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }
    include /etc/nginx/media.conf;
    include /etc/nginx/web.conf;
}
