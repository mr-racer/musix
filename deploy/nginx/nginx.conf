# v2 edge (dev). The njs module verifies signed media/image URLs; Python never serves bytes.
load_module modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { audio/flac flac; audio/mp4 m4a; }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json application/problem+json application/javascript text/css image/svg+xml application/manifest+json;

    js_path /etc/nginx/njs/;
    js_import verify from verify.js;
    js_set $media_ok verify.check;

    include /etc/nginx/conf.d/*.conf;
}
