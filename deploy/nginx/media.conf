# Signed media (/m/<sha>/<tier>.<ext>), images (/i/<id>/<size>.webp), app downloads.
# Paths mirror <media>/m/<sha[:2]>/<sha>/ and <media>/i/<id[:2]>/<id>/ (contexts/media).
location ~ "^/m/(?<h2>[0-9a-f]{2})(?<hr>[0-9a-f]{62})/(?<f>[a-z_]+\.[a-z0-9]+)$" {
    if ($media_ok = 0) { return 403; }
    alias /mnt/data/musix-v2-media/m/$h2/$h2$hr/$f;
    add_header Cache-Control "private, max-age=21600";
}
location ~ "^/i/(?<i2>[0-9a-f]{2})(?<ir>[0-9a-f]{62})/(?<sz>[0-9]+)\.webp$" {
    if ($media_ok = 0) { return 403; }
    alias /mnt/data/musix-v2-media/i/$i2/$i2$ir/$sz.webp;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /download/ {
    alias /mnt/data/musix-v2-media/downloads/;
}
