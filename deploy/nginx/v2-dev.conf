# v2 dev edge: the API behind /api/v2, media from disk (media.conf), the web client (web.conf).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Docker's DNS, re-resolved (`resolve`): a recreated api container gets a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep-alive to the api: a new TCP connection per request runs the ephemeral ports out
# in TIME_WAIT at ~500 rps (502 "Address not available" in the phase-1 bench).
upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 64;
}

# A WebSocket upgrade passes "upgrade"; everything else sends an empty Connection so the
# upstream connection is kept alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;  # server level: a location-level proxy_set_header drops all inherited ones

    location /api/v2/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
    }
    location /api/v2/ {
        proxy_pass http://api;
    }
    include /etc/nginx/media.conf;
    include /etc/nginx/web.conf;
}
