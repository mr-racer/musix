# v2 dev edge. Phase 1 adds /m/* and /i/* (signed media from disk) and limit_req.
server {
    listen 80;
    location /api/v2/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { return 404; }
}
