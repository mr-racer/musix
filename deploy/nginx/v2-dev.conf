# v2 dev edge: the API behind /api/v2, media from disk (media.conf).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    # Docker's DNS, re-resolved: a recreated api container gets a new IP, and a static
    # `proxy_pass http://api:8000` would keep the old one until nginx restarts (502s)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    location /api/v2/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/v2/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
    include /etc/nginx/media.conf;
    location / { return 404; }
}
