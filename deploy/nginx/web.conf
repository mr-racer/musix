# The web client (phase 5): a static SPA. Hashed assets are immutable; the shell, the
# service worker and the manifest must revalidate so a deploy reaches every tab.
location = /sw.js { root /srv/web; add_header Cache-Control "no-cache"; }
location = /index.html { root /srv/web; add_header Cache-Control "no-cache"; }
location /assets/ {
    root /srv/web;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location / {
    root /srv/web;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    # no third-party origins: fonts are self-hosted, media and the API are this origin
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'";
}
