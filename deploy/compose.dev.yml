# MusiX v2 dev stack. Runs NEXT TO v1 prod on the same box, so: its own project
# name, volumes and network, and every port on 127.0.0.1:18xxx (v1 uses 8000/6333).
# `make dev` from v2/ brings it up; `make dev GPU=1` adds compose.dev.gpu.yml.
name: musix-v2-dev

x-server: &server
  build: ../server
  image: musix-v2-server:dev
  environment: &server-env
    MUSIX_DATABASE_URL: postgresql://musix:musix@postgres:5432/musix
    MUSIX_QDRANT_URL: http://qdrant:6333
    MUSIX_MEDIA_DIR: /mnt/data/musix-v2-media
    MUSIX_LIBRARY_ROOTS: '["/mnt/data/music", "/mnt/data/musix-v2-media/dev-subset"]'
    MUSIX_ML_URL: http://ml:8002
  # Same paths inside and out: media_files.path is a host path, and nginx serves the same.
  volumes:
    - /mnt/data/musix-v2-media:/mnt/data/musix-v2-media
    - /mnt/data/music:/mnt/data/music:ro

services:
  postgres:
    image: postgres:18
    command: postgres -c shared_preload_libraries=pg_stat_statements -c max_connections=100 -c idle_in_transaction_session_timeout=30s
    environment: {POSTGRES_USER: musix, POSTGRES_PASSWORD: musix, POSTGRES_DB: musix}
    ports: ["127.0.0.1:18432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musix -d musix"]
      interval: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.18.2  # = prod
    ports: ["127.0.0.1:18333:6333"]
    volumes: [qdrant:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      retries: 30

  migrate:
    <<: *server
    command: alembic upgrade head
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  api:
    <<: *server
    # spec §1: 4 workers (2 × cores, capped); the api holds no models, so they share nothing
    # but Postgres. /metrics sums them through the multiprocess dir (fresh per start).
    command: >-
      sh -c "rm -rf /tmp/prom && mkdir -p /tmp/prom &&
      exec uvicorn musix.api.app:create_app --factory --host 0.0.0.0 --port 8000 --workers 4"
    environment:
      <<: *server-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    ports: ["127.0.0.1:18000:8000"]
    volumes:
      - secrets:/var/lib/musix/secrets
      - /mnt/data/musix-v2-media:/mnt/data/musix-v2-media
      - /mnt/data/music:/mnt/data/music:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v2/ready', timeout=3)"]
      interval: 3s
      retries: 20

  worker:
    <<: *server
    # every queue but `ai`, which has its own single-slot worker below
    command: procrastinate --app=musix.workers.app.app worker --concurrency 3 --queues default,ingest,media,net,ml
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "procrastinate", "--app=musix.workers.app.app", "healthchecks"]
      interval: 10s
      retries: 6

  worker-ai:
    <<: *server
    # the one local LLM: concurrency 1; interactive jobs outrank bulk enrichment by priority.
    # Its own profile: the LLM on this box is prod's, so dev only uses it when asked
    # (`docker compose --profile ai up -d worker-ai`); until then `ai` jobs wait queued.
    profiles: [ai]
    command: procrastinate --app=musix.workers.app.app worker --concurrency 1 --queues ai
    environment:
      <<: *server-env
      MUSIX_LLM_BASE_URL: ${MUSIX_LLM_BASE_URL:-http://192.168.0.168:8082/v1}
      MUSIX_LLM_MODEL: ${MUSIX_LLM_MODEL:-qwen3.8-27b-ud-iq3_s}
    volumes:
      - /mnt/data/musix-v2-media:/mnt/data/musix-v2-media
      - secrets:/var/lib/musix/secrets:ro  # the Fernet key only: the admin's LLM API key
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "procrastinate", "--app=musix.workers.app.app", "healthchecks"]
      interval: 10s
      retries: 6

  ml:
    build: ../ml
    image: musix-v2-ml:dev
    # CPU in dev, capped: the box's GPU and most of its RAM belong to prod. Models load
    # on first use; the weights are v1's, mounted read-only (nothing downloaded twice).
    environment: {ML_DEVICE: cpu, ML_THREADS: "4"}
    mem_limit: 10g
    volumes:
      - v1-hf-cache:/models/hf:ro
      - /mnt/data/lyrics-search/weights:/models/weights:ro
      - /mnt/data/music:/mnt/data/music:ro
      - /mnt/data/musix-v2-media:/mnt/data/musix-v2-media:ro
    ports: ["127.0.0.1:18002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 3s
      retries: 20

  # `docker compose --profile snap up -d api-snap`: the api on the loaded prod snapshot
  # (tools/migrate/load_snapshot.py → database musix_snap), for the gates and benches
  api-snap:
    <<: *server
    profiles: [snap]
    environment:
      <<: *server-env
      MUSIX_DATABASE_URL: postgresql://musix:musix@postgres:5432/musix_snap
    volumes:
      - secrets:/var/lib/musix/secrets
      - /mnt/data/musix-v2-media:/mnt/data/musix-v2-media
      - /mnt/data/music:/mnt/data/music:ro
    ports: ["127.0.0.1:18010:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v2/ready', timeout=3)"]
      interval: 3s
      retries: 20

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/v2-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/media.conf:/etc/nginx/media.conf:ro
      - ./nginx/njs:/etc/nginx/njs:ro
      - secrets:/etc/nginx/secrets:ro
      - /mnt/data/musix-v2-media:/mnt/data/musix-v2-media:ro
      - /mnt/data/music:/mnt/data/music:ro
    ports: ["127.0.0.1:18080:80"]
    depends_on: {api: {condition: service_healthy}}

volumes:
  pgdata:
  qdrant:
  secrets:
  # v1 prod's HF cache, read-only: the same weights, never downloaded twice
  v1-hf-cache:
    external: true
    name: lyrics-search_hf-cache
