# ─────────────────────────────────────────────────────────────────────────────
# nginx reverse-proxy для MusiX на VPS (Ubuntu).
# Кладётся в /etc/nginx/sites-available/musix.conf и симлинкуется в
# /etc/nginx/sites-enabled/. Проксирует на 127.0.0.1:8000 — это дальний конец
# обратного SSH-туннеля с домашней машины.
#
# Версия со стейджингом v2 (фаза 6): пути /api/v2/, /m/, /i/ идут на второй туннель
# 127.0.0.1:8001 (v2 на домашнем сервере). Всё остальное — v1, как раньше.
# ─────────────────────────────────────────────────────────────────────────────

# Зона лимита запросов для брутфорса логина. Должна лежать в http{}-контексте —
# в Debian/Ubuntu этот файл инклюдится из http{}, так что директива валидна тут.
limit_req_zone $binary_remote_addr zone=musix_auth:10m rate=10r/m;

# HTTP :80 — только ACME-челлендж и редирект на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name musixai.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 — основной сервер.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name musixai.ru;

    # Сертификаты Let's Encrypt (создаются certbot'ом — см. README).
    ssl_certificate     /etc/letsencrypt/live/musixai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musixai.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Загрузки: MUSIX_MAX_UPLOAD_MB (по умолчанию 200) + запас.
    client_max_body_size 250m;

    # Заголовки безопасности.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS — включай ТОЛЬКО после того как убедился, что HTTPS работает стабильно.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Общие настройки проксирования (наследуются всеми location ниже) ──
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    # SSE (прогресс индексации, стриминг чата) — без буферизации и с длинным
    # таймаутом, иначе живой прогресс встанет.
    proxy_buffering  off;
    proxy_cache      off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Прячем автодокументацию API от ботов.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Брутфорс-лимит на логин и на разовый bootstrap.
    location = /api/v1/auth/login {
        limit_req zone=musix_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/v1/instance/setup {
        limit_req zone=musix_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # ── MusiX v2 (стейджинг перед переключением): только пути v2 → второй туннель :8001.
    # У v1 таких путей нет (у него /api/v1 и SPA), поэтому v1 это не задевает.
    location ^~ /api/v2/auth/ {
        limit_req zone=musix_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
    location = /api/v2/ws {
        # location со своими proxy_set_header теряет унаследованные — перечисляем все
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_pass http://127.0.0.1:8001;
    }
    location ^~ /api/v2/ { proxy_pass http://127.0.0.1:8001; }
    location ^~ /m/      { proxy_pass http://127.0.0.1:8001; }
    location ^~ /i/      { proxy_pass http://127.0.0.1:8001; }

    # Всё остальное (SPA + API + стрим аудио) — на туннель.
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
