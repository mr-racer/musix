[project]
name = "musix"
version = "2.0.0.dev0"
description = "MusiX v2 server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<2",
    "procrastinate[psycopg]>=3.10,<4",
    "qdrant-client>=1.19,<1.20",
    "structlog>=26.1",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.3,<4",
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=25.1",
    "mutagen>=1.47",
    "pyvips>=3.0",
    "prometheus-client>=0.23",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-exporter-otlp-proto-http>=1.37",
    "numpy>=2.3",
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy>=2.3,<2.4",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "testcontainers[postgres,qdrant]>=4.15,<5",
    "httpx2>=2.13.1",
    "schemathesis>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musix"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]  # assert is how pytest tests assert

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test DSNs carry throwaway passwords
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["musix"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (testcontainers)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:testcontainers.*"]
