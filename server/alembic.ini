[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
# The URL comes from Settings (MUSIX_DATABASE_URL) in migrations/env.py.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
