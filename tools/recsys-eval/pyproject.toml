[project]
name = "recsys-eval"
version = "0.1.0"
description = "Offline evaluation harness for «Поток» (phase 0 §4.4, stream spec §2/§10)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "scipy>=1.16",
    "scikit-learn>=1.7",
    "lightgbm>=4.6",
]

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
